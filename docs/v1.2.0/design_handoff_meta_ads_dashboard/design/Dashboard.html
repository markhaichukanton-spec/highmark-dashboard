<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>High Mark — Aurora Scents · Meta Ads Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F4F0E6;--paper:#FFFFFF;--cream:#EDE6D2;--row-alt:#F9F7F2;
  --ink:#15131A;--gold:#C9A84C;--gold-deep:#8E6F3E;--muted:#6B6E7A;
  --blue:#5B8DEF;--violet:#7A6ECC;
  --line:rgba(20,18,30,.10);--line-2:rgba(20,18,30,.16);
  --good-bg:#ECFDF0;--good-ink:#15803D;--bad-bg:#FEF2F2;--bad-ink:#B91C1C;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"DM Sans",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
::selection{background:var(--gold);color:#15110A}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)}

/* page frame — fixed analytics width, centered. container-type lets the
   layout respond to the dashboard's own width (not the raw viewport). */
.dash{width:1440px;max-width:100%;margin:0 auto;min-height:100vh;background:var(--bg);container-type:inline-size;container-name:dash}

/* ── STICKY TOPBAR (filters + KPI pin; header scrolls away above them) ── */
.topbar{position:sticky;top:0;z-index:30;box-shadow:0 0 0 rgba(20,18,30,0);transition:box-shadow .25s,transform .3s cubic-bezier(.4,0,.1,1),opacity .26s}
/* when the Campaign Breakdown table reaches the top, the KPI bar detaches,
   slides up and disappears — the table's column header pins in its place */
.topbar.away{transform:translateY(-114%);opacity:0;pointer-events:none}x-shadow .25s}
.topbar.stuck{box-shadow:0 10px 24px -16px rgba(20,18,30,.28)}

/* ── HEADER ── */
.dash-head{background:#F4F0E6;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:22px 32px;backdrop-filter:blur(6px);transition:padding .22s cubic-bezier(.4,0,.1,1)}
.head-left{display:flex;align-items:center;gap:20px}
.hm-logo{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.02em;color:var(--ink);line-height:1;transition:font-size .22s cubic-bezier(.4,0,.1,1)}
.hm-logo .slash{color:var(--gold)}
.head-div{width:1px;height:34px;background:var(--line-2);transition:height .22s}
.head-titles{overflow:hidden}
.head-titles .eyebrow{display:block;margin-bottom:3px;max-height:16px;opacity:1;transition:max-height .22s,opacity .18s,margin .22s}
.head-h1{font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:-.01em;line-height:1;transition:font-size .22s cubic-bezier(.4,0,.1,1)}
.head-right{display:flex;align-items:center;gap:12px}
.daterange{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
.daterange svg{color:var(--muted)}
.dr-sep{color:var(--muted)}
.export-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;transition:.15s}
.export-btn:hover{border-color:var(--line-2);box-shadow:0 4px 12px -6px rgba(20,18,30,.18)}
.export-btn svg{color:var(--gold-deep)}

/* ── DROPDOWN ── */
.dd{display:inline-flex;flex-direction:column;gap:5px}
.dd-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dd-field{position:relative;display:inline-flex;align-items:center}
.dd-field select{appearance:none;-webkit-appearance:none;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 32px 9px 13px;cursor:pointer;min-width:150px;transition:.15s}
.dd-field select:hover{border-color:var(--line-2)}
.dd-field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.16)}
.dd-field .caret{position:absolute;right:11px;color:var(--muted);pointer-events:none}
.dd-compact .dd-field select{min-width:0;padding:9px 30px 9px 13px;font-weight:400;color:var(--muted)}

/* ── MULTISELECT ── */
.ms{position:relative;display:inline-flex;flex-direction:column;gap:5px}
.ms-trigger{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;transition:.15s;text-align:left}
.ms-trigger:hover{border-color:var(--line-2)}
.ms.open .ms-trigger{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.16)}
.ms-trigger.active{border-color:var(--gold-deep)}
.ms-trigger.active .ms-summary{color:var(--gold-deep);font-weight:600}
.ms-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-trigger .caret{color:var(--muted);flex:0 0 auto;transition:transform .18s}
.ms.open .ms-trigger .caret{transform:rotate(180deg)}
.ms-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:max(100%,210px);background:var(--paper);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 44px -16px rgba(20,18,30,.4);overflow:hidden;animation:msIn .14s ease}
@keyframes msIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ms-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
.ms-search input{flex:1;border:0;outline:none;background:transparent;font-family:var(--sans);font-size:13px;color:var(--ink);min-width:0}
.ms-search input::placeholder{color:var(--muted)}
.ms-clear{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
.ms-clear:hover{color:var(--ink)}
.ms-actions{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ms-act{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);background:var(--cream);border:1px solid var(--line);border-radius:7px;padding:7px;cursor:pointer;transition:.14s}
.ms-act:hover{border-color:var(--gold);color:var(--ink)}
.ms-list{max-height:230px;overflow-y:auto;padding:6px}
.ms-list::-webkit-scrollbar{width:9px}
.ms-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--paper)}
.ms-opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink);text-align:left;transition:.12s}
.ms-opt:hover{background:rgba(201,168,76,.1)}
.ms-box{width:17px;height:17px;flex:0 0 auto;border:1.6px solid var(--line-2);border-radius:5px;display:grid;place-items:center;color:#fff;transition:.14s}
.ms-opt.on .ms-box{background:var(--gold);border-color:var(--gold)}
.ms-opt-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-empty{padding:16px 10px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ── FILTER BAR ── */
.filter-bar{background:var(--cream);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:18px;padding:16px 32px;transition:padding .22s cubic-bezier(.4,0,.1,1)}
.fb-tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);padding-bottom:10px;transition:padding .22s}
.fb-fields{display:flex;gap:12px;flex-wrap:nowrap;flex:1;min-width:0}
.fb-fields .dd{flex:1 1 0;min-width:0}
.fb-fields .dd-lbl{max-height:14px;opacity:1;transition:max-height .22s,opacity .18s,margin .22s}
.fb-fields .dd-field{width:100%}
.fb-fields .dd-field select{min-width:0;width:100%;transition:padding .22s,font-size .22s}
.fb-reset{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:9px 14px;cursor:pointer;transition:.15s;white-space:nowrap}
.fb-reset:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.fb-reset:disabled{opacity:.4;cursor:default}

/* measuring helper — kill transitions while we read compact/full heights */
.dash.no-anim,.dash.no-anim *{transition:none !important}

/* ── content padding ── */
.dash-body{padding:26px 32px 48px}
.section-gap{margin-top:26px}

/* ── KPI BLOCK ──
   Base = EXPANDED state (default, no JS). Compaction is driven scroll-linked via
   inline styles in JS (rAF) — NOT CSS transitions: font-size/max-height are
   layout properties that transition on the main thread and stall under Recharts'
   continuous work, leaving them stuck. Scroll-linked inline styles can't stall. */
.kpi-block{background:var(--cream);border-bottom:1px solid var(--line);padding:11px 32px 14px}
.kpi-block-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;max-height:18px;opacity:1;margin-bottom:8px;overflow:hidden}
.kpi-hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.kpi{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 13px 10px;box-shadow:0 1px 2px rgba(20,18,30,.04);transition:border-color .16s,box-shadow .16s,transform .16s;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.kpi:hover{border-color:var(--line-2);box-shadow:0 8px 18px -14px rgba(20,18,30,.28);transform:translateY(-1px)}
.kpi.sel{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc) inset,0 8px 20px -14px rgba(20,18,30,.3)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;background:var(--mc);opacity:0;transition:opacity .16s}
.kpi.sel .kpi-accent{opacity:1}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-label{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kpi-dot{width:8px;height:8px;border-radius:2px;border:1.5px solid;flex:0 0 auto;transition:.16s}
.kpi-delta{display:inline-flex;align-items:center;gap:2px;font-family:var(--sans);font-weight:600;font-size:10.5px;padding:2px 6px;border-radius:999px;line-height:1}
.kpi-delta.good{background:var(--good-bg);color:var(--good-ink)}
.kpi-delta.bad{background:var(--bad-bg);color:var(--bad-ink)}
.kpi-value{font-family:var(--mono);font-weight:500;font-size:19px;letter-spacing:-.01em;color:var(--ink);line-height:1.05;margin-top:1px;white-space:nowrap}
.kpi-sub{font-family:var(--sans);font-size:10px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:16px;opacity:1}

/* ── GRANULARITY ── */
.gran{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.gran-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg-btn{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);background:transparent;border:0;border-radius:7px;padding:5px 13px;cursor:pointer;transition:.14s}
.seg-btn:hover{color:var(--ink)}
.seg-btn.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(20,18,30,.12);font-weight:600}

/* ── ANALYTICS GRID (chart 80% · donut 20%) ── */
.analytics-grid{display:grid;grid-template-columns:4fr 1fr;gap:14px;align-items:stretch}
.analytics-grid>*{min-width:0}
.chart-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;box-shadow:0 1px 2px rgba(20,18,30,.04);display:flex;flex-direction:column}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.chart-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);display:block;margin-bottom:4px}
.chart-title{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.05}
.chart-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.lg-item{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.lg-item i{width:9px;height:9px;border-radius:3px;display:inline-block}
.lg-item i.lg-line{width:14px;height:2.5px;border-radius:2px}
.chart-body{flex:1;min-height:240px;width:100%}
.chart-body .recharts-cartesian-axis-tick text{font-family:var(--mono)}

/* ── GEO DONUT ── */
.pie-card{padding:18px 16px 16px}
.pie-head{margin-bottom:8px}
.pie-seg{display:flex;gap:2px;background:var(--cream);border:1px solid var(--line);border-radius:7px;padding:2px;margin-bottom:4px}
.pie-seg-btn{flex:1;font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--muted);background:transparent;border:0;border-radius:5px;padding:4px 3px;cursor:pointer;transition:.14s;white-space:nowrap}
.pie-seg-btn:hover{color:var(--ink)}
.pie-seg-btn.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,18,30,.12)}
.pie-seg-btn.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--mc);margin-right:4px;vertical-align:middle}
.pie-body{position:relative;height:188px;width:100%;margin-top:6px}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pc-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pc-val{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;color:var(--ink)}
.pie-legend{display:flex;flex-direction:column;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pl-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.pl-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.pl-name{flex:1;font-family:var(--sans);color:#3A3B47}
.pl-amt{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.tip-share{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.55);margin-top:6px}

/* recharts tooltip */
.chart-tip{background:var(--ink);border-radius:10px;padding:11px 13px;box-shadow:0 14px 32px -12px rgba(0,0,0,.5);min-width:150px}
.tip-period{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.tip-row{display:flex;align-items:center;gap:8px;margin-top:5px}
.tip-dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.tip-name{font-family:var(--sans);font-size:12px;color:rgba(255,255,255,.7);flex:1}
.tip-val{font-family:var(--mono);font-size:12px;font-weight:500;color:#fff}

/* ── TABLE ── */
.table-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(20,18,30,.04);overflow:hidden;margin-top:14px}
.table-head-bar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:18px 20px 14px}
.table-title{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.table-hint{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.table-scroll{overflow-x:hidden}
.summary-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
/* fixed layout: name column takes a fixed share, the 10 numeric columns split
   the rest equally — the table always fits its container, never scrolls sideways */
.summary-table th:first-child,.summary-table td:first-child{width:23%}
.summary-table thead th{position:sticky;top:0;background:var(--cream);font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);padding:11px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:2}
/* desktop: drop the nested scroll containers so thead pins to the WINDOW (an
   overflow:auto/hidden ancestor would trap sticky inside the card). Narrow
   screens keep overflow-x:auto for horizontal scroll. */
@container dash (min-width:1025px){
  .table-card{overflow:visible;min-height:calc(100svh - 40px)}
  .table-scroll{overflow:visible}
}
/* shadow under the column header once it has pinned at the top (KPI bar gone) */
.dash:has(.topbar.away) .summary-table thead th{box-shadow:0 10px 22px -16px rgba(20,18,30,.4)}
/* tighten cells on narrower viewports so all 11 columns keep fitting */
@container dash (max-width:1180px){
  .summary-table tbody td{padding-left:6px;padding-right:6px}
  .summary-table thead th{padding-left:6px;padding-right:6px;font-size:9px;letter-spacing:.08em}
  .tcell-num{font-size:11px}
}
@container dash (max-width:720px){
  .summary-table th:first-child,.summary-table td:first-child{width:20%}
  .summary-table tbody td{padding-left:4px;padding-right:4px}
  .summary-table thead th{padding-left:4px;padding-right:4px}
  .tcell-num{font-size:10px}
}
.th-left{text-align:left}.th-right{text-align:right}
.th-inner{display:inline-flex;align-items:center;gap:5px}
.th-right .th-inner{flex-direction:row-reverse}
.th.sortable,th.sortable{cursor:pointer}
th.sortable{cursor:pointer;user-select:none;transition:.12s}
th.sortable:hover{color:var(--ink)}
th.sorted{color:var(--ink)}
.sort-ind{opacity:0;font-size:9px;transition:.12s;transform:translateY(-1px)}
th.sortable:hover .sort-ind{opacity:.4}
.sort-ind.on{opacity:1;color:var(--gold-deep)}
.sort-ind.on.asc{transform:rotate(180deg)}
.summary-table tbody td{padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.summary-table thead th{padding-left:9px;padding-right:9px}
.summary-table tbody tr:last-child td{border-bottom:0}
.tcell-name{text-align:left;white-space:nowrap}
.tcell-num{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;text-overflow:ellipsis}
.name-txt{display:inline-block;vertical-align:middle;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sans)}
/* depth styling */
.tr-d0 .name-txt{font-weight:600;color:var(--ink)}
.tr-d0 td{background:var(--paper)}
.tr-d1 .name-txt{font-weight:500;color:#3A3B47;font-size:12.5px}
.tr-d1 td{background:var(--row-alt)}
.tr-d2 .name-txt{font-weight:400;color:var(--muted);font-size:12.5px}
.tr-d2 td{background:var(--paper)}
.tr-d1 .tcell-num{color:#3A3B47}
.tr-d2 .tcell-num{color:var(--muted)}
.summary-table tbody tr:hover td{background:rgba(201,168,76,.06)}
/* twist toggle */
.twist{width:18px;height:18px;border-radius:5px;border:1px solid var(--line-2);background:var(--paper);display:inline-grid;place-items:center;vertical-align:middle;margin-right:9px;cursor:pointer;color:var(--muted);transition:.15s}
.twist:hover{border-color:var(--gold);color:var(--gold-deep)}
.twist svg{transition:transform .18s}
.twist.open svg{transform:rotate(90deg)}
.twist.open{background:var(--ink);border-color:var(--ink);color:#fff}
.twist-spacer{display:inline-block;width:18px;height:18px;margin-right:9px;vertical-align:middle}

/* footer note */
.dash-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dash-foot .hm-mini{font-family:var(--serif);font-size:14px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.dash-foot .hm-mini .slash{color:var(--gold)}

/* ── FIT-TO-SCREEN OVERVIEW ──
   Metrics + chart + donut share one viewport height; metrics & granularity
   keep their natural size, the analytics row flexes to fill the rest.
   Only when chart + donut sit side-by-side (≥1025) — narrow screens scroll. */
@container dash (min-width:1025px){
  /* size the chart zone to the COMPACT topbar height: on load the full bar sits
     above it (chart spills below the fold → page scrolls); once scrolled the bar
     compacts & pins, the chart slides up under it and fills ~80% of the screen. */
  .overview{display:flex;flex-direction:column;height:calc(100svh - var(--topbar-ch, 225px) - 14px);min-height:460px}
  .overview .gran{margin:12px 0 10px}
  .overview .analytics-grid{flex:1 1 auto;min-height:0}
  /* grid/flex items default to min-height:auto and refuse to shrink below their
     content — force them to honour the flexed track so nothing spills past the fold */
  .overview .chart-card,.overview .pie-card{height:100%;min-height:0;overflow:hidden}
  /* Recharts ResponsiveContainer needs a definite box — flex height:100% is
     indefinite at mount and measures 0. Give each body a positioned context
     and let the responsive container absolutely fill it. */
  .overview .chart-body{flex:1 1 auto;min-height:0;position:relative}
  .overview .pie-body{flex:1 1 auto;height:auto;min-height:96px}
  /* legend keeps its full height (donut absorbs the slack); never scroll/clip */
  .overview .pie-legend{flex:0 0 auto;overflow:hidden;min-height:0}
  .overview .chart-body .recharts-responsive-container,
  .overview .pie-body .recharts-responsive-container{position:absolute;inset:0;width:auto !important;height:auto !important}

  /* ── make the CHART the hero: compress KPI block & chrome so the analytics
     row (flex:1) claims most of the height; widen the donut column a touch ── */
  .overview .kpi-block-head{margin-bottom:6px}
  .overview .kpi-row{gap:8px}
  .overview .kpi{padding:7px 11px 7px;gap:1px}
  .overview .kpi-value{font-size:17px}
  .overview .kpi-sub{font-size:9.5px}
  .overview .gran{margin:4px 0 6px}
  /* give the chart more of the row's width-independent chrome back to the plot */
  .overview .chart-card{padding:14px 16px 8px}
  .overview .chart-head{margin-bottom:6px}
  /* donut column wider + tighter chrome + compact legend so the ring reads large */
  .overview .analytics-grid{grid-template-columns:3fr 1.12fr}
  .overview .pie-card{padding:14px 14px 12px}
  .overview .pie-head{margin-bottom:6px}
  .overview .pie-legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:9px;padding-top:9px}
  /* compact legend: name + share% (exact value stays available on donut hover) */
  .overview .pl-amt{display:none}
}

/* ─────────────────────────── RESPONSIVE ─────────────────────────── */

/* Small laptop / tablet landscape: stack chart + donut, reflow KPI grid */
@container dash (max-width:1024px){
  .dash-head{padding:18px 22px}
  .filter-bar{padding:14px 22px}
  .dash-body{padding:22px 22px 44px}

  /* KPI auto-fits — keeps full rows, no orphan cards, down to 2 cols */
  .kpi-row{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .kpi-sub{display:block}

  /* chart over donut, full width each */
  .analytics-grid{grid-template-columns:1fr}
  /* lay the donut card out horizontally so it isn't a tall empty band */
  .pie-card{
    display:grid;column-gap:28px;align-items:center;
    grid-template-columns:minmax(0,300px) 1fr;
    grid-template-areas:"head head" "seg seg" "body legend";
  }
  .pie-head{grid-area:head}
  .pie-seg{grid-area:seg;max-width:400px}
  .pie-body{grid-area:body}
  .pie-legend{grid-area:legend;margin-top:0;padding-top:0;border-top:none}

  /* once filters wrap, the sticky header gets tall and pins over content — let it scroll */
  .topbar{position:static}

  /* filter fields pack into a tidy auto-fit grid instead of stretching wide */
  .fb-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
  .fb-fields .dd{flex:initial;min-width:0}
}

/* Tablet portrait / large phone */
@container dash (max-width:720px){
  .dash-head{flex-wrap:wrap;gap:14px}
  .head-right{width:100%;flex-wrap:wrap;gap:10px}
  .head-right .daterange{flex:1 1 auto;justify-content:center}
  .head-right .dd{flex:1 1 140px}
  .head-right .dd-field,.head-right .dd-field select{width:100%}

  .kpi-block-head{flex-direction:column;align-items:flex-start;gap:3px}
  .kpi-hint{display:none}

  .chart-head{flex-wrap:wrap}
  .chart-legend{justify-content:flex-start}

  /* donut back to a single stacked column */
  .pie-card{grid-template-columns:1fr;grid-template-areas:"head" "seg" "body" "legend"}
  .pie-seg{max-width:none}
  .pie-legend{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

  .gran{flex-wrap:wrap;gap:9px}
  .seg{overflow-x:auto;max-width:100%}

  .dash-foot{flex-direction:column;align-items:flex-start;gap:8px}
}

/* Phone */
@container dash (max-width:480px){
  .dash-head{padding:14px 16px}
  .filter-bar{padding:12px 16px}
  .dash-body{padding:18px 16px 40px}

  .kpi-row{grid-template-columns:repeat(2,1fr)}

  .hm-logo{font-size:22px}
  .head-h1{font-size:19px}
  .head-div{height:28px}

  .fb-fields .dd{flex:1 1 100%}
  .fb-reset{width:100%}

  .chart-body{min-height:220px}
  .chart-card{padding:16px 14px 10px}
}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#F4F0E6">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

    <rect x="120" y="260" width="700" height="160" rx="14" fill="#ffffff" stroke="#e3dcc8"/>
    <rect x="150" y="300" width="180" height="70" rx="8" fill="#C9A84C"/>
    <rect x="360" y="300" width="180" height="70" rx="8" fill="#5B8DEF"/>
    <rect x="570" y="300" width="180" height="70" rx="8" fill="#7A6ECC"/>
    <rect x="120" y="450" width="520" height="200" rx="14" fill="#ffffff" stroke="#e3dcc8"/>

  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="dash-data.r2.jsx"></script>
<script type="text/babel" src="dash-ui.r2.jsx"></script>
<script type="text/babel" src="dash-charts.r2.jsx"></script>

<script type="text/babel">
// Suppress Recharts' internal defaultProps deprecation warnings (library-side, benign)
(function () {
  const orig = console.error;
  console.error = function (...args) {
    const m = args[0];
    if (typeof m === 'string' && m.includes('defaultProps')) return;
    orig.apply(console, args);
  };
})();

const { useState, useCallback, useEffect } = React;

function Dashboard() {
  const [compare, setCompare] = useState('vs previous period');
  const [gran, setGran] = useState('Day');
  // selected metrics (ordered) — first drives the GEO donut. Min 1.
  const [selected, setSelected] = useState(['roas', 'revenue', 'spend']);

  const initialFilters = Object.fromEntries(Object.keys(DATA.FILTERS).map((k) => [k, []]));
  const [filters, setFilters] = useState(initialFilters);
  const onFilter = useCallback((k, v) => setFilters((f) => ({ ...f, [k]: v })), []);
  const resetFilters = useCallback(() => setFilters(initialFilters), []);

  const toggleMetric = useCallback((key) => {
    setSelected((cur) => {
      if (cur.includes(key)) {
        if (cur.length === 1) return cur; // keep at least one
        return cur.filter((k) => k !== key);
      }
      return [...cur, key];
    });
  }, []);

  const firstMeta = DATA.METRIC_META[selected[0]];

  // Scroll-linked KPI compaction. We drive the compaction with explicit inline
  // styles every animation frame (interpolating over a 0→90px scroll range)
  // instead of CSS transitions on font-size/max-height — those are layout
  // properties that transition on the main thread and STALL under Recharts'
  // continuous work, leaving the metrics stuck (the bug the verifier caught).
  // Being the animation ourselves means it can never stall; it's scroll-linked
  // so it feels native; metric NAMES are never touched so they stay visible.
  const topbarRef = React.useRef(null);
  useEffect(() => {
    const dash = document.querySelector('.dash');
    const topbar = topbarRef.current;
    const body = document.querySelector('.dash-body');
    if (!dash || !topbar || !body) return;
    const RANGE = 90;                 // px of scroll to fully compact
    const lerp = (a, b, t) => a + (b - a) * t;
    const paint = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const t = Math.min(1, Math.max(0, y / RANGE)); // 0 = expanded, 1 = compact
      const block = topbar.querySelector('.kpi-block');
      const head = topbar.querySelector('.kpi-block-head');
      if (block) { block.style.paddingTop = lerp(11, 8, t) + 'px'; block.style.paddingBottom = lerp(14, 8, t) + 'px'; }
      if (head) { head.style.maxHeight = lerp(18, 0, t) + 'px'; head.style.opacity = String(1 - t); head.style.marginBottom = lerp(8, 0, t) + 'px'; }
      topbar.querySelectorAll('.kpi').forEach((c) => { const p = lerp(9, 6, t); c.style.paddingTop = p + 'px'; c.style.paddingBottom = p + 'px'; });
      topbar.querySelectorAll('.kpi-value').forEach((v) => { v.style.fontSize = lerp(19, 15, t) + 'px'; });
      topbar.querySelectorAll('.kpi-sub').forEach((s) => { s.style.maxHeight = lerp(16, 0, t) + 'px'; s.style.opacity = String(1 - t); });
      topbar.classList.toggle('stuck', y > 6);

      // ── Swap KPI bar ⇄ table header ──
      // When the Campaign Breakdown header row reaches the very top, detach &
      // hide the KPI bar and let the table's <thead> (sticky top:0) pin in its
      // place. Only on desktop, where the table pins to the window (≥1025).
      const wide = dash.getBoundingClientRect().width >= 1025;
      const thead = dash.querySelector('.summary-table thead');
      if (wide && thead) {
        const theadTop = thead.getBoundingClientRect().top;
        const wasAway = topbar.classList.contains('away');
        // enter when the header reaches the top; exit a bit lower (hysteresis)
        const away = wasAway ? theadTop <= 28 : theadTop <= 0.5;
        topbar.classList.toggle('away', away);
      } else {
        topbar.classList.remove('away');
      }

      // size the fit-to-screen chart zone to the (now current) pinned bar height
      const padTop = parseFloat(getComputedStyle(body).paddingTop) || 0;
      dash.style.setProperty('--topbar-ch', Math.round(topbar.getBoundingClientRect().height + padTop) + 'px');
    };
    // call synchronously on scroll (browser already throttles scroll to ~frame
    // rate); rAF is unreliable in offscreen/preview contexts, so we don't rely on it
    window.addEventListener('scroll', paint, { passive: true });
    window.addEventListener('resize', paint, { passive: true });
    paint();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    return () => { window.removeEventListener('scroll', paint); window.removeEventListener('resize', paint); };
  }, []);

  return (
    <div className="dash">
      <Header since="May 26, 2026" until="Jun 01, 2026" compare={compare} onCompare={setCompare} />
      <div className="topbar" ref={topbarRef}>
        <FilterBar filters={DATA.FILTERS} values={filters} onChange={onFilter} onReset={resetFilters} />
        <KPIRow kpis={DATA.KPIS} selected={selected} onToggle={toggleMetric} metas={DATA.METRIC_META} />
      </div>

      <div className="dash-body">
        <div className="overview">
          <Granularity value={gran} onChange={setGran} />

          <div className="analytics-grid">
            <MetricChart data={DATA.SERIES} selected={selected} metas={DATA.METRIC_META} />
            <GeoBars geoData={DATA.GEO} metas={DATA.METRIC_META} colors={DATA.GEO_COLORS} />
          </div>
        </div>

        <SummaryTable rows={DATA.TABLE} />

        <div className="dash-foot">
          <span>Read-only client view · Data refreshed 07 Jun 2026, 08:00 GST</span>
          <span className="hm-mini">High<span className="slash">/</span>Mark</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
